name: Capture README screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - agent/readme-screenshots
    paths:
      - tools/capture-readme-screenshots.sh
      - .github/workflows/capture-readme-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/readme-screenshots
          fetch-depth: 0

      - name: Build, run, and capture
        run: bash tools/capture-readme-screenshots.sh
